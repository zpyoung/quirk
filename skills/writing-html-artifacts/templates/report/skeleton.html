<!doctype html>
{{header}}
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
{{head}}
<style>
body { display: block; margin: 0; }
body > header.q-masthead { background: none; text-align: left; margin: 0; padding: var(--q-space-4) 0 var(--q-space-5); border-bottom: 1px solid var(--q-color-border); }
body > header.q-masthead > .q-wrap { margin-block-start: 0; }
body > header.q-masthead h1 { max-width: none; margin: var(--q-space-3) 0 0; }
.q-chrome { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--q-space-3); }
.q-chrome .q-theme-toggle { position: static; }
.q-chrome .q-data-picker { margin: 0; }
main section { margin: 0; padding: 0; border: 0; }
main section + section { margin-top: var(--q-space-7); padding-top: var(--q-space-6); border-top: 1px solid var(--q-color-border); }
.q-lede { font-size: var(--q-size-h4); }
.q-meta { margin-block: 0 var(--q-space-5); color: var(--q-color-text-muted); font-size: var(--q-size-small); }
.q-chart { position: relative; height: 320px; margin-block: var(--q-space-4); }
.q-table-wrap { overflow-x: auto; }
.q-table-wrap caption { text-align: left; }
.q-table-wrap table { display: table; width: 100%; margin: var(--q-space-3) 0; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
.q-sort { display: inline-flex; align-items: center; min-height: 44px; margin: 0; padding: var(--q-space-1) 0; border: 0; background: none; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
.q-sort:enabled:hover { background: none; text-decoration: underline; }
th[aria-sort="ascending"] .q-sort::after { content: "\25B2"; margin-inline-start: var(--q-space-1); font-size: var(--q-size-small); }
th[aria-sort="descending"] .q-sort::after { content: "\25BC"; margin-inline-start: var(--q-space-1); font-size: var(--q-size-small); }
</style>
</head>
<body>
<header class="q-masthead">
<div class="q-wrap">
<div class="q-chrome">{{chrome}}</div>
<h1>{{title}}</h1>
</div>
</header>
<div class="q-wrap">
{{regions}}
</div>
{{data}}
{{body_end}}
</body>
</html>
